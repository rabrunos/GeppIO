<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
  <title id="title">GeppIO — seu espaço de trabalho, do seu jeito</title>
  <desc id="description">Original illustration of a modular workspace. Cream typography and orange accents on deep blue, alongside abstract note, code and checklist tiles. This is artwork, not an application screenshot.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#192333"/>
      <stop offset="1" stop-color="#12161e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#f58a30" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f58a30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#f4e4d3"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#acb7c9" fill-opacity=".1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offset"/>
      <feFlood flood-color="#050a12" flood-opacity=".32" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="drop"/>
      <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bounds"><rect width="1280" height="440" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="440" fill="url(#canvas)"/>
    <rect x="623" width="657" height="440" fill="url(#dots)"/>
    <ellipse cx="1080" cy="294" rx="460" ry="340" fill="url(#glow)"/>
    <path d="M646-60V500M622 390H1340" stroke="#6a7c98" stroke-opacity=".12"/>
    <circle cx="1120" cy="231" r="254" fill="none" stroke="#f49a56" stroke-opacity=".1"/>
    <circle cx="1120" cy="231" r="296" fill="none" stroke="#f49a56" stroke-opacity=".05"/>

    <g font-family="Segoe UI, Arial, sans-serif">
      <g transform="translate(80 66)">
        <rect width="28" height="28" rx="6" fill="#f49a56"/>
        <rect x="35" width="18" height="12" rx="4" fill="#f49a56" fill-opacity=".55"/>
        <rect x="35" y="19" width="18" height="28" rx="4" fill="#f49a56" fill-opacity=".85"/>
        <rect y="35" width="28" height="12" rx="4" fill="#f49a56" fill-opacity=".4"/>
        <text x="75" y="30" fill="#acb7c9" font-size="17" font-weight="600" letter-spacing="3">WORKBENCH MODULAR</text>
      </g>
      <text x="73" y="244" fill="#fbf9f6" font-size="142" font-weight="700" letter-spacing="-8">Gepp<tspan fill="#f49a56">IO</tspan></text>
      <text x="82" y="299" fill="#c7ced9" font-size="28" letter-spacing="-.5">Seu espaço. Do seu jeito.</text>
      <path d="M82 354H133" stroke="#f49a56" stroke-width="4" stroke-linecap="round"/>
      <text x="149" y="361" fill="#8f9db1" font-size="17" letter-spacing="1">LOCAL · EXTENSÍVEL · MODULAR</text>
