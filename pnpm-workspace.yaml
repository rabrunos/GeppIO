# Only verified build-tool versions may run dependency install scripts.
allowBuilds:
  'esbuild@0.25.12 || 0.28.2': true
minimumReleaseAgeExclude:
  - electron@44.6.0
# pnpm 11 reads non-authentication settings here, rather than from .npmrc.
saveExact: true
engineStrict: true
strictPeerDependencies: true
strictDepBuilds: true
