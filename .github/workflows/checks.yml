name: GeppIO checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geppio-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-tests:
    name: Windows ${{ matrix.group }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [core, ide, workbench]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned from the inspected method
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require the real resolved lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path pnpm-lock.yaml)) { throw 'Run pnpm install locally, validate and commit the real lockfile before CI.' }
      - name: Install the selected package manager
        run: npm install --global pnpm@11.25.0
      - name: Install the locked graph
        run: pnpm install --frozen-lockfile
      - name: Check structure, types, lint, tests and build
        if: matrix.group == 'core'
        run: pnpm check
      - name: Build independent runner assets
        if: matrix.group != 'core'
        run: pnpm plugins:build && pnpm build
      # The union is exactly the existing pnpm test:desktop and focused native gates.
      # No competing mouse/focus journeys within one interactive Windows desktop.
      - name: Sequential Electron suites with individual timings and failure status
        run: pnpm test:ci:${{ matrix.group }}
      - name: Audit the complete locked dependency graph
        if: ${{ !cancelled() && matrix.group == 'core' }}
        run: pnpm audit
  # Native host (#74): Rust + upstream GPUI, separate from the Electron shards.
  native:
    name: Windows native
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_DENY_VERSION: '0.20.2'
      CARGO_DENY_SHA256: '975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, approved in #73
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            native/target
          key: native-${{ runner.os }}-${{ hashFiles('native/rust-toolchain.toml', 'native/Cargo.lock', 'native/examples/geppui-consumer/Cargo.lock') }}
      - name: Install the pinned toolchain from rust-toolchain.toml
        working-directory: native
        run: rustup toolchain install && rustc --version
      # The gate binary is downloaded and checksum-verified on every run, never restored from a cache.
      - name: Install the checksum-verified cargo-deny release
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/geppio-cargo-deny"
          mkdir -p "$destination"
          # Relative names: GNU tar reads a Windows "D:\..." archive path as a remote host.
          cd "$destination"
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-pc-windows-msvc"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz" \
            --output cargo-deny.tar.gz
          printf '%s  %s\n' "$CARGO_DENY_SHA256" cargo-deny.tar.gz | sha256sum --check --status
          tar -xzf cargo-deny.tar.gz "${name}/cargo-deny.exe"
          echo "$destination/${name}" >> "$GITHUB_PATH"
      - name: Format
        working-directory: native
        run: cargo fmt --all --check
      - name: Dependency, license, advisory and source policy
        working-directory: native
        run: cargo deny --locked check -W unmaintained
      - name: Lint
        working-directory: native
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests (geppio-core headless, then the workspace)
        working-directory: native
        run: cargo test --locked -p geppio-core && cargo test --locked --workspace
      - name: Release build
        working-directory: native
        run: cargo build --locked --release -p geppio
      - name: External GeppUI consumer policy and build
        working-directory: native/examples/geppui-consumer
        run: cargo deny --locked check -W unmaintained && cargo build --locked --target-dir ../../target
  # Preserve the previous required-check identity; success requires every shard, native AND Secrets.
  windows:
    needs: [windows-tests, native, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all Windows groups, native and Secrets
        env:
          WINDOWS_RESULT: ${{ needs.windows-tests.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: test "$WINDOWS_RESULT" = success && test "$NATIVE_RESULT" = success && test "$SECRETS_RESULT" = success
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Check history with a checksum-verified scanner
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/geppio-gitleaks"
          mkdir -p "$destination"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$destination/scanner.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$destination/scanner.tar.gz" | sha256sum --check --status
          tar -xzf "$destination/scanner.tar.gz" -C "$destination" gitleaks
          "$destination/gitleaks" git --redact --no-banner --log-opts=--all --timeout=180 .
